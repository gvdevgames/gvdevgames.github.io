<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A challenge from a friend · Memory Training · GV Dev</title>
<meta name="description" content="Open this challenge in Memory Training and play the same boards your friend played.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1026"><meta name="color-scheme" content="dark">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/site.css">
<style>
.challenge{max-width:520px;margin:40px auto;text-align:center}
.challenge .big{font-size:1.6rem;margin:18px 0 8px}
.challenge p{opacity:.8}
.challenge .open{display:inline-block;margin:18px 0 10px;padding:14px 26px;border-radius:999px;background:#4fd1a5;color:#0b2a20;font-weight:700;text-decoration:none}
.challenge .store{display:block;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="brand" href="../../index.html"><span class="mark">GV</span>GV Dev</a>
<nav class="main"><a href="../../index.html#apps">Apps</a><a href="mailto:gvdevgames@gmail.com">Contact</a></nav>
</header>
<main id="main">
<div class="challenge">
<h1 class="big">A challenge from a friend</h1>
<p id="what">Memory Training: play the same boards your friend played and see who gets further.</p>
<a class="open" id="open" href="#">Open in Memory Training</a>
<p id="hint">If the app does not open, get it on Google Play, then tap the link again.</p>
<a class="store" href="https://play.google.com/store/apps/details?id=com.memorytrain.game" title="Get it on Google Play"><img src="../../assets/google-play-badge.svg" alt="Get it on Google Play" width="180" height="53"></a>
</div>
</main>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var game = params.get("g") || "";
  var seed = params.get("s") || "";
  var store = "https://play.google.com/store/apps/details?id=com.memorytrain.game";
  var names = {NUMBER_ORDER:"Number Order",PATTERN_GRID:"Pattern Grid",SEQUENCE:"Sequence",WHATS_MISSING:"What's Missing",PAIRS:"Pairs",FACES:"Faces & Names",SHOPPING:"Shopping List",WHERE_WAS_IT:"Where Was It",PHONE_NUMBER:"Phone Number",COLOUR_MATCH:"Who Wore What",TRAIL:"Trail",LINEUP:"Lineup",ADD_UP:"Add Up",TWO_BACK:"Two Back"};
  if (names[game]) document.getElementById("what").textContent = names[game] + ": play the same boards your friend played and see who gets further.";
  // Android: the app's own scheme through an intent link, with the store as the fallback.
  var intent = "intent://challenge?g=" + encodeURIComponent(game) + "&s=" + encodeURIComponent(seed) +
    "#Intent;scheme=memorytraining;package=com.memorytrain.game;S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
  var open = document.getElementById("open");
  open.href = /android/i.test(navigator.userAgent) ? intent : store;
  if (/android/i.test(navigator.userAgent) && game && seed) setTimeout(function () { location.href = intent; }, 400);
})();
</script>
</body></html>
